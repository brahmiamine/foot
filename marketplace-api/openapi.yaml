openapi: 3.0.3
info:
  title: marketplace-api
  description: >
    Marketplace vendeur multi-clubs de l'écosystème `foot`. Trois surfaces :
    `/auth` (public), routes vendeur (`SellerJwtGuard`), et routes internes
    service-à-service (`ServiceAuthGuard`, parfois combiné à
    `AllowedApplicationsGuard` qui restreint à une liste explicite
    d'applications appelantes — voir moderation/payouts internes).

    TASK-P0-019 (todo.md) : document écrit à la main à partir du code réel
    des contrôleurs — couvre l'intégralité des routes et leur modèle
    d'autorisation (le problème central : "APIs implicites, changement
    cassant sans notification"), avec un niveau de détail plus léger sur
    les schémas de requête/réponse que payment-api/notification-api vu le
    volume de cette API (~65 routes) — à enrichir DTO par DTO au besoin
    plutôt que reporté entièrement. Pas de génération automatique
    (`@nestjs/swagger`) branchée sur le build, voir la note dans todo.md.
  version: "1.0.0"
servers:
  - url: /
    description: Base URL configurée par déploiement (variable PORT)

paths:
  /health:
    get:
      operationId: getHealth
      summary: Santé du service
      security: []
      tags: [health]
      responses:
        "200": { description: OK }
        "503": { description: DB injoignable }

  /health/inventory:
    get:
      operationId: getInventoryHealth
      summary: Métrique d'oversell (TASK-P0-005) — sonde ops, cible zéro
      description: >
        Compte les InventoryItem dont `available` est négatif — ne devrait
        jamais arriver en fonctionnement normal, l'UPDATE conditionnel de
        InventoryService.reserveStock empêchant tout stock négatif. Sonde
        défensive, pas un chemin attendu.
      security: []
      tags: [health]
      responses:
        "200":
          description: Statistique d'oversell.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  violatingItemCount: { type: integer }
                  timestamp: { type: string, format: date-time }

  /auth/register:
    post:
      operationId: registerSeller
      summary: Crée un compte vendeur
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterSellerDto" }
      responses:
        "201": { description: Compte créé }
        "409": { description: Email déjà utilisé }

  /auth/login:
    post:
      operationId: loginSeller
      summary: Authentifie un vendeur, retourne un JWT
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginDto" }
      responses:
        "200": { description: JWT vendeur }
        "401": { description: Identifiants invalides }

  /sellers/me:
    get:
      operationId: getMySellerProfile
      summary: Profil du vendeur connecté
      tags: [sellers]
      security: [{ SellerJwt: [] }]
      responses:
        "200": { description: OK }
    patch:
      operationId: updateMySellerProfile
      summary: Met à jour le profil du vendeur connecté
      tags: [sellers]
      security: [{ SellerJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: OK }

  /sellers:
    get:
      operationId: listSellers
      summary: Liste tous les vendeurs (service-à-service)
      tags: [sellers]
      security: [{ ServiceApiKey: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: OK }

  /sellers/{id}:
    get:
      operationId: getSeller
      summary: Détail d'un vendeur (service-à-service)
      tags: [sellers]
      security: [{ ServiceApiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: OK }
        "404": { description: Introuvable }

  /sellers/{id}/status:
    patch:
      operationId: updateSellerStatus
      summary: Change le statut de modération d'un vendeur (applications autorisées uniquement)
      tags: [sellers]
      security: [{ ServiceApiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [PENDING, APPROVED, SUSPENDED, REJECTED] }
      responses:
        "200": { description: OK }
        "403": { description: Application appelante non autorisée (AllowedApplicationsGuard) }

  /products:
    post:
      operationId: createProduct
      summary: Crée un produit (vendeur connecté)
      tags: [products]
      security: [{ SellerJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductWriteDto" }
      responses:
        "201": { description: Créé }
    get:
      operationId: listProducts
      summary: Liste les produits du vendeur connecté
      tags: [products]
      security: [{ SellerJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: OK }

  /products/{id}:
    get:
      operationId: getProduct
      summary: Détail d'un produit du vendeur connecté
      tags: [products]
      security: [{ SellerJwt: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: OK }
        "404": { description: Introuvable ou n'appartient pas au vendeur }
    patch:
      operationId: updateProduct
      summary: Met à jour un produit du vendeur connecté
      tags: [products]
      security: [{ SellerJwt: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductWriteDto" }
      responses:
        "200": { description: OK }
    delete:
      operationId: deleteProduct
      summary: Supprime un produit du vendeur connecté
      tags: [products]
      security: [{ SellerJwt: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: OK }

  /products/{id}/toggle-active:
    post:
      operationId: toggleProductActive
      summary: Active/désactive un produit
      tags: [products]
      security: [{ SellerJwt: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: OK }

  /products/{id}/submit:
    post:
      operationId: submitProduct
      summary: Soumet un produit DRAFT à la modération
      tags: [products]
      security: [{ SellerJwt: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: OK }
        "409": { description: Statut actuel incompatible avec la soumission }

  /products/{id}/withdraw:
    post:
      operationId: withdrawProduct
      summary: Retire un produit publié (redevient DRAFT)
      tags: [products]
      security: [{ SellerJwt: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: OK }

  /internal/products:
    post:
      operationId: createProductInternal
      summary: Crée un produit pour le compte d'une app cliente (ex. sellerPortal)
      tags: [internal]
      security: [{ ServiceApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductWriteDto" }
      responses:
        "201": { description: Créé }

  /internal/products/{id}:
    get:
      operationId: getProductInternal
      summary: Détail d'un produit (service-à-service)
      tags: [internal]
      security: [{ ServiceApiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: OK }
    patch:
      operationId: updateProductInternal
      summary: Met à jour un produit (service-à-service)
      tags: [internal]
      security: [{ ServiceApiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductWriteDto" }
      responses:
        "200": { description: OK }
    delete:
      operationId: deleteProductInternal
      summary: Supprime un produit (service-à-service)
      tags: [internal]
      security: [{ ServiceApiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: OK }

  /internal/products/{id}/submit:
    post:
      operationId: submitProductInternal
      summary: Soumet un produit à la modération (service-à-service)
      tags: [internal]
      security: [{ ServiceApiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: OK }

  /internal/products/{id}/withdraw:
    post:
      operationId: withdrawProductInternal
      summary: Retire un produit publié (service-à-service)
      tags: [internal]
      security: [{ ServiceApiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: OK }

  /internal/products/{id}/toggle-active:
    post:
      operationId: toggleProductActiveInternal
      summary: Active/désactive un produit (service-à-service)
      tags: [internal]
      security: [{ ServiceApiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: OK }

  /products/{productId}/variants:
    get:
      operationId: listVariants
      summary: Liste les déclinaisons d'un produit du vendeur connecté
      tags: [variants]
      security: [{ SellerJwt: [] }]
      parameters: [{ $ref: "#/components/parameters/ProductIdPath" }]
      responses:
        "200": { description: OK }
    post:
      operationId: createVariant
      summary: Crée une déclinaison
      tags: [variants]
      security: [{ SellerJwt: [] }]
      parameters: [{ $ref: "#/components/parameters/ProductIdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VariantWriteDto" }
      responses:
        "201": { description: Créée }

  /products/{productId}/variants/{id}:
    patch:
      operationId: updateVariant
      summary: Met à jour une déclinaison
      tags: [variants]
      security: [{ SellerJwt: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProductIdPath" }
        - { $ref: "#/components/parameters/IdPath" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VariantWriteDto" }
      responses:
        "200": { description: OK }
    delete:
      operationId: deleteVariant
      summary: Supprime une déclinaison
      tags: [variants]
      security: [{ SellerJwt: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProductIdPath" }
        - { $ref: "#/components/parameters/IdPath" }
      responses:
        "200": { description: OK }

  /products/{productId}/variants/{id}/toggle-active:
    post:
      operationId: toggleVariantActive
      summary: Active/désactive une déclinaison
      tags: [variants]
      security: [{ SellerJwt: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProductIdPath" }
        - { $ref: "#/components/parameters/IdPath" }
      responses:
        "200": { description: OK }

  /categories:
    get:
      operationId: listCategories
      summary: Liste les catégories (public)
      security: []
      tags: [categories]
      responses:
        "200": { description: OK }
    post:
      operationId: createCategory
      summary: Crée une catégorie (service-à-service)
      tags: [categories]
      security: [{ ServiceApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201": { description: Créée }

  /categories/{id}:
    patch:
      operationId: updateCategory
      summary: Met à jour une catégorie (service-à-service)
      tags: [categories]
      security: [{ ServiceApiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: OK }
    delete:
      operationId: deleteCategory
      summary: Supprime une catégorie (service-à-service)
      tags: [categories]
      security: [{ ServiceApiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: OK }

  /inventory:
    get:
      operationId: listInventory
      summary: Stock des produits/déclinaisons du vendeur connecté
      tags: [inventory]
      security: [{ SellerJwt: [] }]
      responses:
        "200": { description: OK }

  /inventory/{id}:
    patch:
      operationId: adjustInventory
      summary: Ajuste le stock d'une déclinaison
      tags: [inventory]
      security: [{ SellerJwt: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                delta: { type: integer, description: "Ajustement relatif (peut être négatif)." }
      responses:
        "200": { description: OK }

  /orders/{id}:
    get:
      operationId: getOrderInternal
      summary: Détail d'une commande (service-à-service)
      tags: [orders]
      security: [{ ServiceApiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: OK }
        "404": { description: Introuvable }

  /seller-orders:
    get:
      operationId: listSellerOrders
      summary: Commandes du vendeur connecté (paginé)
      tags: [seller-orders]
      security: [{ SellerJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: OK }

  /seller-orders/{id}:
    get:
      operationId: getSellerOrder
      summary: Détail d'une commande du vendeur connecté
      tags: [seller-orders]
      security: [{ SellerJwt: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: OK }
        "404": { description: Introuvable ou n'appartient pas au vendeur }

  /seller-orders/{id}/prepare:
    post:
      operationId: prepareSellerOrder
      summary: Transition PENDING -> PREPARING
      tags: [seller-orders]
      security: [{ SellerJwt: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: OK }
        "409": { description: Transition invalide depuis le statut actuel }

  /seller-orders/{id}/ready-to-ship:
    post:
      operationId: readyToShipSellerOrder
      summary: Transition PREPARING -> READY_TO_SHIP
      tags: [seller-orders]
      security: [{ SellerJwt: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: OK }
        "409": { description: Transition invalide depuis le statut actuel }

  /seller-orders/{id}/ship:
    post:
      operationId: shipSellerOrder
      summary: Transition READY_TO_SHIP -> SHIPPED
      tags: [seller-orders]
      security: [{ SellerJwt: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                trackingNumber: { type: string }
                carrier: { type: string }
      responses:
        "200": { description: OK }
        "409": { description: Transition invalide depuis le statut actuel }

  /seller-orders/{id}/deliver:
    post:
      operationId: deliverSellerOrder
      summary: Transition SHIPPED -> DELIVERED
      tags: [seller-orders]
      security: [{ SellerJwt: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: OK }
        "409": { description: Transition invalide depuis le statut actuel }

  /returns:
    get:
      operationId: listReturns
      summary: Retours reçus par le vendeur connecté (paginé)
      tags: [returns]
      security: [{ SellerJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: OK }

  /returns/{id}:
    get:
      operationId: getReturn
      summary: Détail d'un retour du vendeur connecté
      tags: [returns]
      security: [{ SellerJwt: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: OK }
        "404": { description: Introuvable ou n'appartient pas au vendeur }

  /returns/{id}/approve:
    post:
      operationId: approveReturn
      summary: Approuve une demande de retour
      tags: [returns]
      security: [{ SellerJwt: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: OK }

  /returns/{id}/reject:
    post:
      operationId: rejectReturn
      summary: Rejette une demande de retour
      tags: [returns]
      security: [{ SellerJwt: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { reason: { type: string } }
      responses:
        "200": { description: OK }

  /returns/{id}/complete:
    post:
      operationId: completeReturn
      summary: Marque un retour comme traité (remboursement effectué)
      tags: [returns]
      security: [{ SellerJwt: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: OK }

  /internal/returns:
    post:
      operationId: createReturnInternal
      summary: Crée une demande de retour pour le compte d'une app cliente
      tags: [internal]
      security: [{ ServiceApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201": { description: Créée }

  /payouts:
    get:
      operationId: listMyPayouts
      summary: Versements du vendeur connecté
      tags: [payouts]
      security: [{ SellerJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: OK }

  /internal/payouts:
    post:
      operationId: createPayoutInternal
      summary: Crée un versement (applications autorisées uniquement)
      tags: [internal]
      security: [{ ServiceApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201": { description: Créé }
        "403": { description: Application appelante non autorisée (AllowedApplicationsGuard) }

  /internal/payouts/{id}/processing:
    post:
      operationId: markPayoutProcessing
      summary: Transition -> PROCESSING (applications autorisées uniquement)
      tags: [internal]
      security: [{ ServiceApiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: OK }
        "403": { description: Application appelante non autorisée }

  /internal/payouts/{id}/paid:
    post:
      operationId: markPayoutPaid
      summary: Transition -> PAID (applications autorisées uniquement)
      tags: [internal]
      security: [{ ServiceApiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: OK }
        "403": { description: Application appelante non autorisée }

  /internal/payouts/{id}/failed:
    post:
      operationId: markPayoutFailed
      summary: Transition -> FAILED (applications autorisées uniquement)
      tags: [internal]
      security: [{ ServiceApiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { reason: { type: string } }
      responses:
        "200": { description: OK }
        "403": { description: Application appelante non autorisée }

  /internal/payouts/{id}/retry:
    post:
      operationId: retryPayout
      summary: Relance un versement FAILED (applications autorisées uniquement)
      tags: [internal]
      security: [{ ServiceApiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: OK }
        "403": { description: Application appelante non autorisée }

  /moderation/products:
    get:
      operationId: listModerationQueue
      summary: File de modération produits (applications autorisées uniquement)
      tags: [moderation]
      security: [{ ServiceApiKey: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: OK }
        "403": { description: Application appelante non autorisée }

  /moderation/products/{id}:
    get:
      operationId: getModerationProduct
      summary: Détail d'un produit en modération (applications autorisées uniquement)
      tags: [moderation]
      security: [{ ServiceApiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: OK }
        "403": { description: Application appelante non autorisée }

  /moderation/products/{id}/review:
    post:
      operationId: startProductReview
      summary: Passe un produit en revue (applications autorisées uniquement)
      tags: [moderation]
      security: [{ ServiceApiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: OK }
        "403": { description: Application appelante non autorisée }

  /moderation/products/{id}/approve:
    post:
      operationId: approveProduct
      summary: Approuve un produit (applications autorisées uniquement)
      tags: [moderation]
      security: [{ ServiceApiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: OK }
        "403": { description: Application appelante non autorisée }

  /moderation/products/{id}/publish:
    post:
      operationId: publishProduct
      summary: Publie un produit approuvé (applications autorisées uniquement)
      tags: [moderation]
      security: [{ ServiceApiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: OK }
        "403": { description: Application appelante non autorisée }

  /moderation/products/{id}/reject:
    post:
      operationId: rejectProduct
      summary: Rejette un produit (applications autorisées uniquement)
      tags: [moderation]
      security: [{ ServiceApiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { reason: { type: string } }
      responses:
        "200": { description: OK }
        "403": { description: Application appelante non autorisée }

  /notifications/me:
    get:
      operationId: getMyMarketplaceNotifications
      summary: Notifications internes marketplace du vendeur connecté
      tags: [notifications]
      security: [{ SellerJwt: [] }]
      responses:
        "200": { description: OK }

components:
  securitySchemes:
    SellerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT propre au vendeur, émis par POST /auth/login (pas le JWT sso).
    ServiceApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: >
        Clé de service par application appelante (ServiceAuthGuard). Sur
        certaines routes (annotées ci-dessus), en plus restreint à une
        liste explicite d'applications autorisées (AllowedApplicationsGuard).

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string }
    ProductIdPath:
      name: productId
      in: path
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  schemas:
    RegisterSellerDto:
      type: object
      required: [email, password, businessName]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        businessName: { type: string }

    LoginDto:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    ProductWriteDto:
      type: object
      description: >
        Schéma allégé — voir products/dto/*.ts pour le détail exact des
        champs (nom, description, prix, catégorie, images, etc.).
      properties:
        name: { type: string }
        description: { type: string }
        price: { type: number }
        categoryId: { type: string }
        images:
          type: array
          items: { type: string, format: uri }

    VariantWriteDto:
      type: object
      description: "Schéma allégé — voir variants/dto/*.ts."
      properties:
        sku: { type: string }
        attributes: { type: object }
        price: { type: number }
        stock: { type: integer }
