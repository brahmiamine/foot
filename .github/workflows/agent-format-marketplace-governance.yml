name: Agent format marketplace governance

on:
  push:
    branches:
      - feat/marketplace-seller-governance

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/marketplace-seller-governance
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Format marketplace
        working-directory: marketplace
        run: pnpm exec prettier --write "src/**/*.ts"
      - name: Format notifications
        working-directory: notifications
        run: pnpm exec prettier --write "src/**/*.ts"
      - name: Commit formatter changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketplace/src notifications/src
          git commit -m "style: format marketplace governance changes"
          git push origin HEAD:feat/marketplace-seller-governance
