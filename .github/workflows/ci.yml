name: CI

# Rang 6 de avancement.md : aucune CI n'existait avant ce workflow (manquants.md
# § 3.4 le signalait déjà). Une entrée de matrice par app plutôt qu'un
# monorepo pnpm workspace : chaque app garde son propre lockfile et son
# propre cycle de déploiement indépendant (voir packages/auth-shared/README.md
# pour la même logique appliquée à un package partagé).
#
# Ce que ce workflow ne fait PAS : il ne masque pas la dette de lint
# existante. referee-center/federation-hub ont des erreurs `no-explicit-any`
# pré-existantes (respectivement ~106 et ~11, voir avancement.md rang 6) —
# ce job les fait apparaître en rouge intentionnellement plutôt que de les
# exclure, pour que cette dette reste visible au lieu de rester invisible
# comme elle l'était sans CI.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # TASK-P0-017 (todo.md) : "CI pré-deploy check conflits migrations" —
  # détecte une migration ajoutée sous <app>/sql|mysql|migrations/ mais
  # jamais enregistrée dans db/migrations.manifest (silencieusement absente
  # de tout déploiement passant par db/migrate.sh). Pur filesystem, pas de
  # service MySQL requis.
  db-migrations:
    name: db migrations manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./db/validate-manifest.sh

  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: referee-center
            dir: referee-center
            pm: pnpm
            test: true
          - name: match-operations
            dir: match-operations
            pm: pnpm
            test: true
          - name: federation-hub
            dir: federation-hub
            pm: pnpm
            test: true
          - name: club-hub
            dir: club-hub
            pm: pnpm
            test: true
          - name: club-ob
            dir: club-ob
            pm: pnpm
            test: true
          - name: seller-portal
            dir: seller-portal
            pm: pnpm
            test: true
          - name: ticketing
            dir: ticketing
            pm: pnpm
            test: true
          - name: identity
            dir: identity
            pm: pnpm
            test: true
          - name: marketplace
            dir: marketplace
            pm: pnpm
            test: true
          - name: payments
            dir: payments
            pm: npm
            test: true
          - name: notifications
            dir: notifications
            pm: npm
            test: true
    steps:
      - uses: actions/checkout@v4

      # setup-node's pnpm cache calls pnpm to locate its store, so pnpm must
      # already be installed before setup-node restores that cache.
      - name: Setup pnpm
        if: matrix.pm == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ matrix.pm }}
          cache-dependency-path: ${{ matrix.dir }}/${{ matrix.pm == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}

      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.pm == 'pnpm' && 'pnpm install --frozen-lockfile' || 'npm ci' }}

      - name: Typecheck
        if: matrix.pm == 'pnpm'
        working-directory: ${{ matrix.dir }}
        run: npx tsc --noEmit

      - name: Build (typecheck + compile)
        if: matrix.pm == 'npm'
        working-directory: ${{ matrix.dir }}
        run: npm run build

      - name: Lint (pnpm apps)
        if: matrix.pm == 'pnpm' && matrix.name != 'marketplace'
        working-directory: ${{ matrix.dir }}
        run: pnpm run lint

      # marketplace est un Nest app pnpm dont le script `lint` local inclut
      # --fix (scaffolding Nest par défaut, même chose que payments/
      # notifications ci-dessous) : on l'invoque directement sans --fix ici
      # pour que la CI échoue au lieu de corriger silencieusement.
      - name: Lint (marketplace — sans --fix, contrairement au script pnpm run lint local)
        if: matrix.name == 'marketplace'
        working-directory: ${{ matrix.dir }}
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Lint (npm apps — sans --fix, contrairement au script npm run lint local)
        if: matrix.pm == 'npm'
        working-directory: ${{ matrix.dir }}
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Test
        if: matrix.test
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.pm == 'pnpm' && 'pnpm run test' || 'npm test' }}
