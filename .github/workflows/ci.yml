name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db-migrations:
    name: db migrations manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./db/validate-manifest.sh

  i18n:
    name: i18n catalogues FR/AR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/i18n-audit.mjs

  frontend-workspace:
    name: frontend workspace architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate-frontend-workspace.mjs

  architecture-boundaries:
    name: application architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate-architecture-boundaries.mjs

  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arbinote
            dir: arbinote
            pm: pnpm
            test: true
          - name: match-operations
            dir: match-operations
            pm: pnpm
            test: true
          - name: referee-hub
            dir: referee-hub
            pm: pnpm
            test: true
          - name: federation-hub
            dir: federation-hub
            pm: pnpm
            test: true
          - name: club-hub
            dir: club-hub
            pm: pnpm
            test: true
          - name: player-hub
            dir: player-hub
            pm: pnpm
            test: true
          - name: staff-hub
            dir: staff-hub
            pm: pnpm
            test: true
          - name: medical-hub
            dir: medical-hub
            pm: pnpm
            test: true
          - name: club-ob
            dir: club-ob
            pm: pnpm
            test: true
          - name: seller-portal
            dir: seller-portal
            pm: pnpm
            test: true
          - name: ticketing
            dir: ticketing
            pm: pnpm
            test: true
          - name: identity
            dir: identity
            pm: pnpm
            test: true
          - name: marketplace
            dir: marketplace
            pm: pnpm
            test: true
          - name: payments
            dir: payments
            pm: npm
            test: true
          - name: notifications
            dir: notifications
            pm: npm
            test: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        if: matrix.pm == 'pnpm'
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ matrix.pm }}
          cache-dependency-path: ${{ matrix.dir }}/${{ matrix.pm == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}

      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        # --ignore-workspace: chaque app garde une installation pnpm independante de
        # son propre lockfile (voir .npmrc). Sans ce flag, le nouveau pnpm-workspace.yaml
        # racine fait deux choses : (1) il ignore silencieusement le script natif de
        # better-sqlite3 (utilise par les tests d'integration SQLite de arbinote,
        # club-ob, federation-hub, identity, match-operations, club-hub, seller-portal,
        # ticketing), qui echoue alors avec "Could not locate the bindings file" ; (2)
        # il fait echouer l'install de marketplace ("No projects matched the filters"),
        # qui n'est pas un membre du workspace pnpm.
        run: ${{ matrix.pm == 'pnpm' && 'pnpm install --frozen-lockfile --ignore-workspace' || 'npm ci' }}

      - name: Typecheck
        if: matrix.pm == 'pnpm'
        working-directory: ${{ matrix.dir }}
        run: npx tsc --noEmit

      - name: Build (typecheck + compile)
        if: matrix.pm == 'npm'
        working-directory: ${{ matrix.dir }}
        run: npm run build

      - name: Lint (pnpm apps)
        if: matrix.pm == 'pnpm' && matrix.name != 'marketplace'
        working-directory: ${{ matrix.dir }}
        run: pnpm run lint

      - name: Lint (marketplace — sans --fix, contrairement au script pnpm run lint local)
        if: matrix.name == 'marketplace'
        working-directory: ${{ matrix.dir }}
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Lint (npm apps — sans --fix, contrairement au script npm run lint local)
        if: matrix.pm == 'npm'
        working-directory: ${{ matrix.dir }}
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Test
        if: matrix.test
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.pm == 'pnpm' && 'pnpm run test' || 'npm test' }}
