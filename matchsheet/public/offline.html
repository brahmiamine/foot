<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hors ligne — MatchSheet</title>
    <style>
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #1f2530;
        color: #e9ecef;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card { max-width: 420px; }
      h1 { color: #3b82f6; font-size: 1.5rem; margin-bottom: 12px; }
      p { color: #adb5bd; line-height: 1.5; }
      button {
        margin-top: 20px;
        background: #3b82f6;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 10px 20px;
        font-size: 1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Pas de connexion</h1>
      <p>MatchSheet n'a pas pu joindre le serveur. Vérifiez votre connexion puis réessayez — aucune saisie en cours n'a été perdue localement.</p>
      <button onclick="location.reload()">Réessayer</button>
    </div>
  </body>
</html>
